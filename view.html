<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>파일 보기 | 총무 AI LAB</title>
<link rel="stylesheet" href="assets/style.css">
<style>
.viewer-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.backbtn{display:inline-flex;align-items:center;gap:6px;text-decoration:none;font-weight:800;color:#fff;background:var(--navy);border-radius:12px;padding:10px 18px}
.backbtn:hover{background:#1e293b}
.fname{font-family:ui-monospace,Menlo,monospace;font-size:14px;color:var(--muted);word-break:break-all}
.md{background:#fff;border:1px solid var(--line);border-radius:22px;padding:30px 34px}
.md h1{font-size:26px;margin:0 0 14px}.md h2{font-size:21px;margin:26px 0 10px}.md h3{font-size:18px;margin:22px 0 8px}
.md pre{background:#0b1220;color:#e5e7eb;border-radius:12px;padding:14px 16px;overflow:auto;white-space:pre-wrap}
.md pre code{background:none;border:0;color:inherit;padding:0}
.md blockquote{margin:12px 0;padding:8px 16px;border-left:4px solid var(--blue-line);background:var(--blue-soft);border-radius:8px}
.md hr{border:0;border-top:1px solid var(--line);margin:22px 0}
.front{background:#f8fafc;border:1px solid var(--line);border-radius:12px;padding:12px 16px;font-size:14px;color:var(--muted);white-space:pre-wrap;margin-bottom:16px}
</style>
</head>
<body>
<header class="top">
  <div class="wrap top-row">
    <a class="brand" href="index.html"><span class="tag">총무 AI LAB</span>파일 보기</a>
    <nav class="labs" aria-label="이동">
      <a href="index.html"><small>시작</small>안내</a>
      <a href="personal.html#step1"><small>Part 1</small>개인 실습</a>
      <a href="team.html#t1"><small>Part 2</small>팀 실습</a>
    </nav>
  </div>
</header>
<main class="wrap">
  <div class="viewer-bar">
    <a class="backbtn" id="back" href="index.html">← 실습으로 돌아가기</a>
    <span class="fname" id="fname"></span>
    <a class="dl" id="dl" href="#" download>⬇ 이 파일 내려받기</a>
  </div>
  <div class="md" id="content">불러오는 중…</div>
  <div class="viewer-bar" style="margin-top:18px"><a class="backbtn" id="back2" href="index.html">← 실습으로 돌아가기</a></div>
</main>
<footer><div class="wrap">총무 AI LAB · 실습 데이터는 모두 가상입니다.</div></footer>
<script src="https://cdn.jsdelivr.net/npm/marked@12/marked.min.js"></script>
<script>
(function(){
  var q=new URLSearchParams(location.search);
  var f=q.get('f')||''; var back=q.get('back')||'';
  // allow only files inside files/
  if(!/^files\/[^?#]+\.(md|txt|csv)$/.test(f) || f.indexOf('..')>=0){ document.getElementById('content').textContent='볼 수 없는 파일입니다.'; return; }
  var backHref = /^(index|personal|team)\.html(#[\w-]+)?$/.test(back) ? back : 'index.html';
  ['back','back2'].forEach(function(id){ var a=document.getElementById(id); a.href=backHref;
    a.addEventListener('click',function(e){ if(document.referrer && document.referrer.indexOf(location.origin)===0 && history.length>1){ e.preventDefault(); history.back(); } }); });
  document.getElementById('fname').textContent=f.split('/').pop();
  var dl=document.getElementById('dl'); dl.href=f; dl.setAttribute('download', f.split('/').pop());
  document.title=f.split('/').pop()+' | 총무 AI LAB';
  fetch(f).then(function(r){ if(!r.ok) throw new Error(r.status); return r.text(); }).then(function(t){
    t=t.replace(/^\uFEFF/,'');
    var box=document.getElementById('content'); box.innerHTML='';
    var m=t.match(/^---\n([\s\S]*?)\n---\n?/);
    if(m){ var fm=document.createElement('div'); fm.className='front'; fm.textContent=m[1]; box.appendChild(fm); t=t.slice(m[0].length); }
    var body=document.createElement('div');
    if(/\.md$/.test(f) && window.marked){ body.innerHTML=marked.parse(t); }
    else { var pre=document.createElement('pre'); pre.textContent=t; body.appendChild(pre); }
    box.appendChild(body);
  }).catch(function(){ document.getElementById('content').textContent='파일을 불러오지 못했습니다. 아래 내려받기 버튼을 써 주세요.'; });
})();
</script>
</body>
</html>
